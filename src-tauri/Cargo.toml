[package]
name = "imageresizer"
version = "0.1.0"
description = "Desktop batch image compression tool"
edition = "2024"

[lib]
name = "imageresizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", features = ["jpeg", "png", "webp", "gif"] }
jpeg-encoder = "0.7"
# default-features off: no CLI deps, no internal rayon (batch layer already parallelizes)
oxipng = { version = "9", default-features = false }
libwebp-sys = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
rayon = "1.10"
walkdir = "2"
dirs = "5"
chrono = "0.4.44"
log = "0.4"
simplelog = "0.12"
